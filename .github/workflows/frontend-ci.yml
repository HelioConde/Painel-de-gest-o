name: Validacao do frontend

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Testar paginacao Supabase
        run: npm run test:performance
      - name: Testar comparativo e integridade de dados
        run: npm run test:insights
      - name: Verificar build Vite
        run: npm run build
